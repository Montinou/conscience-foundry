[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "conscience-foundry"
version = "0.1.0"
description = "Independent contracts and processing for verified text artifacts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3,<4",
    "pydantic>=2.12,<3",
    "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
cfoundry = "conscience_foundry.cli.main:run"

[project.optional-dependencies]
orchestration = ["dagster>=1.13,<1.14"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "dagster>=1.13,<1.14"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["conscience_foundry*"]
namespaces = true

[tool.setuptools.package-data]
conscience_foundry = ["ledger/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["database: requires explicitly authorized disposable PostgreSQL configuration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
